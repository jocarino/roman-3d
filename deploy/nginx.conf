server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Everything here is static and self-contained. No CDN, no analytics, no
    # third-party anything, so the policy can afford to be strict.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # The voxel bundle is already gzipped on disk and the page decompresses it
    # itself. Serve the bytes untouched: adding Content-Encoding here would make
    # the browser unwrap it first, which works, but only by accident.
    location ~ \.pxob\.gz$ {
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(woff2|png|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Content changes without the filename changing, so these must revalidate.
    location ~* \.(html|json)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
