[project]
name = "pixel-observatory"
version = "0.1.0"
description = "Voxel pipeline for the Pixel Observatory: NASA's Roman Space Telescope as pixel art."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "DracoPy>=2.0.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
observatory = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
